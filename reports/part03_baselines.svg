<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 760 300"><title id="title">Validation MAE by baseline</title><desc id="desc">Mean absolute error in vehicles per hour for three baselines on the same 8,667 eligible validation hours.</desc><style>text{font:15px Arial,sans-serif;fill:#182b3a}.label{font-size:14px}.value{font-size:15px;font-weight:700}.axis{stroke:#788997;stroke-width:1}.grid{stroke:#d9e1e7;stroke-width:1}</style><text x="24" y="28" font-size="18" font-weight="700">2017 validation error (lower is better)</text><text x="208" y="87" text-anchor="end" class="label">Training global mean</text><rect x="220" y="64" width="457.1" height="34" rx="3" fill="#245b86" /><text x="685.1" y="87" class="value">1,743</text><text x="208" y="159" text-anchor="end" class="label">Training weekday + hour</text><rect x="220" y="136" width="73.2" height="34" rx="3" fill="#245b86" /><text x="301.2" y="159" class="value">279</text><text x="208" y="231" text-anchor="end" class="label">Same hour last week</text><rect x="220" y="208" width="79.4" height="34" rx="3" fill="#245b86" /><text x="307.4" y="231" class="value">303</text><line x1="220" y1="264" x2="732" y2="264" class="axis"/><text x="220" y="288" text-anchor="middle" class="label">0</text><text x="732" y="288" text-anchor="end" class="label">1,952 MAE (vehicles/hour)</text></svg>
