[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trafficpulse"
version = "0.1.0"
description = "Leakage-aware hourly traffic forecasting research, built one milestone at a time"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
  "scikit-learn==1.7.2", "numpy==2.2.6", "scipy==1.15.3",
  "joblib==1.5.2", "threadpoolctl==3.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]
